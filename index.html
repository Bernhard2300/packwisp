let D={step:0,dev:null,ver:"",prob:null};
function pageDiag(){
 setMeta(L("Problem-Diagnose für Minecraft-Add-ons – Packwisp","Add-on problem diagnosis for Minecraft – Packwisp"),L("Beantworte drei Fragen und erhalte passende Prüfschritte bei Add-on-Problemen auf iPad, iPhone, Android und Windows.","Answer three questions and get matching troubleshooting steps for add-on problems on iPad, iPhone, Android and Windows."));
 const PR=P(),prog=`<div class="prog" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${i<=D.step?"d":""}"></i>`).join("")}</div>`;
 let h=`<h1>${L("Problem-Diagnose","Problem diagnosis")}</h1>${prog}`;
 if(D.step===0)h+=`<h2>${L("Auf welchem Gerät spielst du?","Which device do you play on?")}</h2><div class="opts">${Object.entries(DEVICES).map(([k,v])=>`<button class="opt" data-dev="${k}">${v}</button>`).join("")}</div>`;
 else if(D.step===1)h+=`<h2>${L("Welche Minecraft-Version hast du?","Which Minecraft version do you have?")}</h2><p style="color:var(--mu)">${L("Zum Beispiel 1.21.50. Du findest sie meist in den Einstellungen im Bereich „Info“. Weißt du sie nicht, lass das Feld leer.","For example 1.21.50. You can usually find it in the settings under “About”. If you don't know it, leave the field empty.")}</p>
  <label class="sr" for="ver">${L("Version","Version")}</label><input id="ver" inputmode="decimal" maxlength="20" placeholder="${L("z. B. 1.21.50","e.g. 1.21.50")}" value="${esc(D.ver)}">
  <p style="margin-top:14px"><button class="btn" data-next>${L("Weiter","Next")}</button> <button class="btn ghost" data-back>${L("Zurück","Back")}</button></p>`;
 else if(D.step===2)h+=`<h2>${L("Was ist das Problem?","What is the problem?")}</h2><div class="opts">${Object.entries(PR).map(([k,v])=>`<button class="opt" data-prob="${k}">${v.label}</button>`).join("")}</div><p><button class="btn ghost" data-back>${L("Zurück","Back")}</button></p>`;
 else{
  const p=PR[D.prob],v=D.ver.trim(),ok=/^\d+(\.\d+){1,3}$/.test(v);
  h+=`<div class="card"><b>${DEVICES[D.dev]}</b> · ${L("Version","Version")}: ${ok?esc(v):L("unbekannt","unknown")} · ${p.label}</div>`;
  if(!v)h+=`<div class="note">${L("Deine Version fehlt. Prüfe sie in den Minecraft-Einstellungen und vergleiche sie mit den Angaben des Add-on-Erstellers. Ohne diese Angabe kann niemand sagen, ob das Add-on passt.","Your version is missing. Check it in the Minecraft settings and compare it with the add-on creator's information. Without it, nobody can say whether the add-on fits.")}</div>`;
  else if(!ok)h+=`<div class="note">${L("„"+esc(v)+"“ sieht nicht wie eine Versionsnummer aus (erwartet: 1.21.50). Prüfe deine Eingabe.","“"+esc(v)+"” does not look like a version number (expected: 1.21.50). Check your input.")}</div>`;
  else h+=`<div class="note">${L("Packwisp kann nicht prüfen, ob ein Add-on zu Version "+esc(v)+" passt. Vergleiche mit den Angaben des Erstellers.","Packwisp cannot check whether an add-on fits version "+esc(v)+". Compare with the creator's information.")}</div>`;
  h+=`<h2>${L("Das kannst du prüfen","What you can check")}</h2><ol class="steps"><li>${DS()[D.dev]}</li>${p.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
  <div class="note bad"><b>${L("Sicherheit","Safety")}:</b> ${L("Lade nichts von unbekannten Seiten. Add-ons sind keine .exe-, .apk- oder .ipa-Dateien.","Do not download anything from unknown sites. Add-ons are not .exe, .apk or .ipa files.")}</div>
  <p>${L("Ausführliche Hilfe","More help")}: <a href="#/anleitung/${p.guide}">${esc(G().find(g=>g.slug===p.guide).title)}</a></p>
  <p><button class="btn ghost" data-reset>${L("Neue Diagnose","New diagnosis")}</button></p>`;
 }
 return h;
}

 const b=$("#langbtn");b.textContent=LANG==="de"?"EN":"DE";b.setAttribute("aria-label",L("Switch to English","Auf Deutsch wechseln"));
 $("#foot").innerHTML=`<p>${L("<b>Packwisp</b> ist ein inoffizielles Fan-Projekt und nicht mit Mojang, Microsoft oder Minecraft verbunden. „Minecraft“ ist eine Marke von Mojang Synergies AB. Diese Seite nutzt keine offiziellen Logos oder Grafiken.","<b>Packwisp</b> is an unofficial fan project and is not affiliated with Mojang, Microsoft or Minecraft. “Minecraft” is a trademark of Mojang Synergies AB. This site uses no official logos or artwork.")}</p>
 <p>${L("Alle Angaben ohne Kennzeichnung „geprüft“ sind unverifiziert. Die Seite speichert nur deine Favoriten und deine Sprachwahl lokal in deinem Browser und sendet keine Daten an Server.","All details without the label “verified” are unverified. This site only stores your favorites and language choice locally in your browser and sends no data to servers.")}</p>
 <p><a href="#/impressum">${L("Impressum","Legal notice (Impressum)")}</a></p>`;
}
function render(){
 const hash=location.hash.replace(/^#\/?/,"");const [r,arg]=hash.split("/");const app=$("#app");
 const key=r||"home";
 document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===(key==="anleitung"?"anleitungen":key)));
 app.innerHTML=`<div class="spin" role="status" aria-label="${L("Lädt","Loading")}"></div>`;
 try{
  let html;
  switch(key){case"home":html=pageHome();break;case"diagnose":html=pageDiag();break;case"addons":html=pageAddons();break;case"anleitungen":html=pageGuides();break;case"anleitung":html=pageGuide(arg);break;case"favoriten":html=pageFavs();break;case"impressum":html=pageImpressum();break;default:html=page404()}
  app.innerHTML=html;
  if(key==="addons")bindAddons();
  if(key!=="diagnose"||D.step===0)window.scrollTo(0,0);
 }catch(e){app.innerHTML=`<div class="note bad"><b>${L("Fehler","Error")}:</b> ${L('Die Seite konnte nicht geladen werden. Lade sie neu oder gehe zur <a href="#/">Startseite</a>.','The page could not be loaded. Reload it or go to the <a href="#/">home page</a>.')}</div>`;console.error(e)}
}
window.addEventListener("hashchange",render);
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.id==="langbtn"){LANG=LANG==="de"?"en":"de";try{localStorage.setItem("pw_lang",LANG)}catch(x){}chrome();render();return}
 if(t.dataset.fav){const id=t.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];saveFavs();
  if(window.__rerun&&$("#alist"))window.__rerun();else render()}
 else if(t.dataset.dev){D.dev=t.dataset.dev;D.step=1;render()}
 else if(t.hasAttribute("data-next")){D.ver=($("#ver").value||"");D.step=2;render()}
 else if(t.hasAttribute("data-back")){if($("#ver"))D.ver=$("#ver").value;D.step=Math.max(0,D.step-1);render()}
 else if(t.dataset.prob){D.prob=t.dataset.prob;D.step=3;render()}
 else if(t.hasAttribute("data-reset")){D={step:0,dev:null,ver:"",prob:null};render()}
});
document.addEventListener("submit",e=>{
 if(e.target.id!=="gsearch")return;e.preventDefault();
 const r=search($("#q").value),box=$("#sres");
 if(!r){box.innerHTML=`<div class="note">${L("Gib einen Suchbegriff ein, zum Beispiel „iPad“ oder „Resource Pack“.","Enter a search term, for example “iPad” or “resource pack”.")}</div>`;return}
 if(!r.g.length&&!r.a.length){box.innerHTML=`<div class="empty"><b>${L("Keine Treffer.","No results.")}</b><br>${L('Versuche ein anderes Wort oder schau in die <a href="#/anleitungen">Anleitungen</a>.','Try another word or look at the <a href="#/anleitungen">guides</a>.')}</div>`;return}
 box.innerHTML=(r.g.length?`<h3 style="margin-top:14px">${L("Anleitungen","Guides")}</h3><div class="list">${r.g.map(guideRow).join("")}</div>`:"")+(r.a.length?`<h3 style="margin-top:14px">${L("Add-ons (Demo)","Add-ons (demo)")}</h3><div class="grid">${r.a.map(addonCard).join("")}</div>`:"");
});
chrome();render();
</script>
</body>
</html>
